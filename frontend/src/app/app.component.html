<div class="min-h-screen bg-gray-50">
  <app-offline-indicator />
  <!-- Desktop Navigation - hidden on mobile when authenticated -->
  <nav class="bg-white shadow-sm" [class.hidden]="isAuthenticated() && true" [class.md:block]="isAuthenticated()">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16">
        <div class="flex">
          <div class="flex-shrink-0 flex items-center">
            <a routerLink="/" class="text-xl font-bold text-primary-600 hover:text-primary-700">
              ⚽ Football Predictions
            </a>
          </div>
          <div class="hidden md:ml-8 md:flex md:space-x-8">
            <a
              routerLink="/leaderboard"
              routerLinkActive="border-primary-500 text-gray-900"
              [routerLinkActiveOptions]="{exact: false}"
              class="border-transparent text-gray-700 hover:border-gray-300 hover:text-gray-900 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium"
            >
              Leaderboard
            </a>
            @if (isAuthenticated()) {
              <a
                routerLink="/predictions"
                routerLinkActive="border-primary-500 text-gray-900"
                [routerLinkActiveOptions]="{exact: false}"
                class="border-transparent text-gray-700 hover:border-gray-300 hover:text-gray-900 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium"
              >
                Predictions
              </a>
            }
            @if (isAdmin()) {
              <a
                routerLink="/admin"
                routerLinkActive="border-primary-500 text-gray-900"
                [routerLinkActiveOptions]="{exact: false}"
                class="border-transparent text-gray-700 hover:border-gray-300 hover:text-gray-900 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium"
              >
                Admin
              </a>
            }
          </div>
        </div>

        <div class="flex items-center space-x-4">
          @if (isAuthenticated()) {
            <span class="text-sm text-gray-700">
              Welcome, <span class="font-semibold">{{ currentUser()?.username }}</span>
            </span>
            <button
              (click)="logout()"
              class="text-sm font-medium text-gray-700 hover:text-primary-600"
            >
              Sign out
            </button>
          } @else {
            <a
              routerLink="/login"
              class="text-sm font-medium text-gray-700 hover:text-primary-600"
            >
              Sign in
            </a>
            <a
              routerLink="/register"
              class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-primary-600 hover:bg-primary-700"
            >
              Sign up
            </a>
          }
        </div>
      </div>
    </div>
  </nav>

  <main [class.pb-16]="isAuthenticated()">
    <router-outlet />
  </main>

  <!-- Bottom Navigation - only for authenticated users on mobile -->
  @if (isAuthenticated()) {
    <app-bottom-navigation />
  }
</div>
