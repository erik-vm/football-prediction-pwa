<div class="bg-cyan-500 rounded-2xl p-6 shadow-lg mb-6">
  <div class="flex items-start justify-between mb-6">
    <h2 class="text-white text-xl font-bold">Your Stats</h2>
    <div class="bg-white bg-opacity-30 rounded-full px-4 py-1">
      <span class="text-white text-sm font-semibold">Rank #{{ displayStats().rank }}</span>
    </div>
  </div>

  <div class="grid grid-cols-3 gap-4">
    <div class="flex flex-col items-center">
      <svg class="w-8 h-8 text-white mb-2" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-11a1 1 0 10-2 0v3.586L7.707 9.293a1 1 0 00-1.414 1.414l3 3a1 1 0 001.414 0l3-3a1 1 0 00-1.414-1.414L11 10.586V7z" clip-rule="evenodd"/>
      </svg>
      <div class="text-3xl font-bold text-white">{{ displayStats().points }}</div>
      <div class="text-white text-sm mt-1">Points</div>
    </div>

    <div class="flex flex-col items-center">
      <svg class="w-8 h-8 text-white mb-2" fill="currentColor" viewBox="0 0 20 20">
        <path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"/>
        <path fill-rule="evenodd" d="M4 5a2 2 0 012-2 3 3 0 003 3h2a3 3 0 003-3 2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V5zm3 4a1 1 0 000 2h.01a1 1 0 100-2H7zm3 0a1 1 0 000 2h3a1 1 0 100-2h-3zm-3 4a1 1 0 100 2h.01a1 1 0 100-2H7zm3 0a1 1 0 100 2h3a1 1 0 100-2h-3z" clip-rule="evenodd"/>
      </svg>
      <div class="text-3xl font-bold text-white">{{ displayStats().predictions }}</div>
      <div class="text-white text-sm mt-1">Predictions</div>
    </div>

    <div class="flex flex-col items-center">
      <svg class="w-8 h-8 text-white mb-2" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
      </svg>
      <div class="text-3xl font-bold text-white">{{ formattedAccuracy() }}%</div>
      <div class="text-white text-sm mt-1">Accuracy</div>
    </div>
  </div>
</div>
