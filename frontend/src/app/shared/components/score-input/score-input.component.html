<div class="flex flex-col items-center">
  <p class="text-sm font-medium text-gray-700 mb-2 text-center truncate max-w-full">
    {{ teamName }}
  </p>
  <div class="flex flex-col items-center bg-white border-2 border-gray-300 rounded-lg p-4 w-32">
    <button
      type="button"
      (click)="increment()"
      class="w-full py-2 bg-cyan-500 hover:bg-cyan-600 text-white rounded-md transition-colors font-bold text-xl disabled:bg-gray-300 disabled:cursor-not-allowed"
      [disabled]="scoreSignal() >= maxScore"
    >
      +
    </button>

    <input
      type="number"
      [value]="scoreSignal()"
      (input)="onScoreChange($event)"
      [min]="minScore"
      [max]="maxScore"
      class="w-full py-4 text-center text-4xl font-bold text-gray-900 border-0 focus:outline-none my-2"
      readonly
    />

    <button
      type="button"
      (click)="decrement()"
      class="w-full py-2 bg-cyan-500 hover:bg-cyan-600 text-white rounded-md transition-colors font-bold text-xl disabled:bg-gray-300 disabled:cursor-not-allowed"
      [disabled]="scoreSignal() <= minScore"
    >
      −
    </button>
  </div>
</div>
