<div class="relative w-full">
  <!-- Black Dropdown Button -->
  <button
    type="button"
    (click)="toggleDropdown()"
    class="w-full bg-black text-white py-3 px-4 rounded-lg flex items-center justify-between hover:bg-gray-900 transition-colors">
    <div class="flex flex-col items-start">
      <span class="text-xs text-gray-400 uppercase tracking-wide">Competition</span>
      <span class="text-base font-medium">
        {{ selectedCompetition ? selectedCompetition.name : 'Select Competition' }}
      </span>
    </div>
    <!-- Dropdown Arrow -->
    <svg
      class="w-5 h-5 transition-transform"
      [class.rotate-180]="isOpen()"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
    </svg>
  </button>

  <!-- Dropdown Menu Overlay -->
  @if (isOpen()) {
    <div class="fixed inset-0 bg-black bg-opacity-50 z-40" (click)="toggleDropdown()"></div>
    <div class="absolute top-full left-0 right-0 mt-2 bg-white rounded-lg shadow-xl z-50 max-h-96 overflow-y-auto">
      @for (competition of competitions(); track competition.code) {
        <button
          type="button"
          (click)="selectCompetition(competition.code)"
          class="w-full px-4 py-3 text-left hover:bg-gray-100 transition-colors border-b border-gray-100 last:border-b-0"
          [class.bg-cyan-50]="competition.code === selectedCompetitionCode()">
          <div class="flex items-center justify-between">
            <div>
              <div class="font-medium text-gray-900">{{ competition.name }}</div>
              <div class="text-sm text-gray-500">{{ competition.code }}</div>
            </div>
            @if (competition.code === selectedCompetitionCode()) {
              <svg class="w-5 h-5 text-cyan-500" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd"
                  d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
                  clip-rule="evenodd" />
              </svg>
            }
          </div>
        </button>
      }
    </div>
  }
</div>
