<div class="min-h-screen bg-white flex flex-col items-center justify-center px-6">
  <div class="w-full max-w-sm">
    <h1 class="text-2xl font-bold text-center text-gray-800 mb-2">Welcome to</h1>
    <h2 class="text-xl font-semibold text-center text-gray-700 mb-8">Football Prediction Game</h2>

    @if (error()) {
      <div class="bg-red-50 text-red-600 p-3 rounded-lg mb-4 text-sm">{{ error() }}</div>
    }

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="Email"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400"
          required
        />
      </div>
      <div>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Password"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400"
          required
        />
      </div>
      <button
        type="submit"
        [disabled]="loading()"
        class="w-full py-3 bg-orange-500 text-white font-semibold rounded-lg hover:bg-orange-600 disabled:opacity-50 transition-colors"
      >
        {{ loading() ? 'Logging in...' : 'Login' }}
      </button>
    </form>

    <button
      routerLink="/register"
      class="w-full mt-3 py-3 bg-orange-400 text-white font-semibold rounded-lg hover:bg-orange-500 transition-colors"
    >
      Register
    </button>
  </div>
</div>
