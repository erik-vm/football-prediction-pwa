<div class="min-h-screen bg-white flex flex-col px-6 pt-12">
  <div class="w-full max-w-sm mx-auto">
    <button routerLink="/login" class="text-gray-600 mb-6 flex items-center gap-1">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
      </svg>
      Back
    </button>

    <h1 class="text-2xl font-bold text-gray-800 mb-8">Sign up</h1>

    @if (error()) {
      <div class="bg-red-50 text-red-600 p-3 rounded-lg mb-4 text-sm">{{ error() }}</div>
    }

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <input
          type="text"
          [(ngModel)]="username"
          name="username"
          placeholder="Name"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400"
          required
        />
      </div>
      <div>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="Email"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400"
          required
        />
      </div>
      <div>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Password"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400"
          required
        />
      </div>
      <button
        type="submit"
        [disabled]="loading()"
        class="w-full py-3 bg-orange-500 text-white font-semibold rounded-lg hover:bg-orange-600 disabled:opacity-50 transition-colors"
      >
        {{ loading() ? 'Registering...' : 'Register' }}
      </button>
    </form>
  </div>
</div>
