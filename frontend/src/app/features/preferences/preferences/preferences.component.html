<div class="pb-20 px-4 pt-4">
  <div class="flex flex-col items-center mb-6">
    <div class="w-20 h-20 bg-gray-200 rounded-full flex items-center justify-center text-gray-500 text-2xl font-bold mb-3">
      {{ username().charAt(0).toUpperCase() }}
    </div>
    <h2 class="text-lg font-bold text-gray-800">{{ username() }}</h2>
  </div>

  <h3 class="text-sm font-semibold text-gray-700 mb-3">Selected Competitions</h3>

  <div class="space-y-2">
    @for (comp of competitions(); track comp.code) {
      <label class="flex items-center gap-3 bg-white rounded-lg p-3 border border-gray-100 cursor-pointer">
        <input
          type="checkbox"
          [checked]="comp.selected"
          (change)="toggleCompetition(comp.code)"
          class="w-5 h-5 text-cyan-500 rounded focus:ring-cyan-400"
        />
        <span class="text-sm text-gray-700">{{ comp.name }}</span>
        <span class="text-xs text-gray-400 ml-auto">{{ comp.code }}</span>
      </label>
    }
  </div>

  <button
    (click)="logout()"
    class="w-full mt-6 py-3 bg-red-50 text-red-600 font-semibold rounded-lg hover:bg-red-100 transition-colors"
  >
    Logout
  </button>
</div>
