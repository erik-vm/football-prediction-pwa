services:
  # Backend API Service
  - type: web
    name: football-prediction-api
    env: dotnet
    region: oregon
    plan: free
    branch: version_1_06_02_2026
    buildCommand: cd backend/src/FootballPrediction.Api && dotnet publish -c Release -o ../../../out
    startCommand: cd out && dotnet FootballPrediction.Api.dll
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:$PORT
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: football-prediction-db
          property: connectionString
      - key: Jwt__SecretKey
        generateValue: true
      - key: Jwt__Issuer
        value: FootballPredictionAPI
      - key: Jwt__Audience
        value: FootballPredictionClient
      - key: Jwt__AccessTokenExpirationMinutes
        value: 1440
      - key: FootballDataApi__BaseUrl
        value: https://api.football-data.org/v4/
      - key: FootballDataApi__ApiKey
        sync: false
      - key: BackgroundJobs__MatchSyncIntervalHours
        value: 6
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: true

databases:
  # PostgreSQL Database
  - name: football-prediction-db
    plan: free
    databaseName: football_prediction
    user: postgres
    region: oregon
